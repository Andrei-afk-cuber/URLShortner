services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USER} -d ${DB_NAME}'"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_HOST}:${DB_TEST_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${DB_USER} -d ${DB_NAME}'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: test-db
      DB_TEST_PORT: 5432
      REDIS_HOST: test-redis
      REDIS_TEST_PORT: 6379
    command: pytest
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy

  migration:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      test:
        condition: service_completed_successfully

  redis:
      image: redis
      ports:
        - "${REDIS_PORT}:6379"
      command: redis-server --requirepass ${REDIS_PASSWORD}
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  test-redis:
    image: redis
    ports:
      - "${REDIS_HOST}:${REDIS_TEST_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5